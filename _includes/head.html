<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}</title>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<script src="{{ "/static/js/theme-init.js" | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<link rel="stylesheet" href="{{ "/static/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:title" content="{% if page.url == "/" %}{{ site.title | escape }}{% else %}{{ page.title | escape }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.url == "/" %}website{% else %}article{% endif %}">
